<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALOLITE - PISTOL & MOVEMENT UPDATE</title>
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f1923; font-family: 'Oswald', sans-serif; user-select: none; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }

        /* UI OVERLAY */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }

        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: #00ffcc; transform: translate(-50%, -50%); border-radius: 50%;
            transition: opacity 0.2s;
        }
        .ch-line { position: absolute; background: #00ffcc; transition: all 0.1s;}
        #ch-top { top: -12px; left: 1px; width: 2px; height: 8px; }
        #ch-bot { bottom: -12px; left: 1px; width: 2px; height: 8px; }
        #ch-left { top: 1px; left: -12px; width: 8px; height: 2px; }
        #ch-right { top: 1px; right: -12px; width: 8px; height: 2px; }

        /* Scope */
        #scope-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.98) 60%, #000 100%);
            display: none; justify-content: center; align-items: center;
        }
        .scope-lines { position: absolute; background: rgba(255, 40, 40, 0.8); }
        .scope-h { width: 100vw; height: 1px; }
        .scope-v { width: 1px; height: 100vh; }
        .scope-dot { width: 4px; height: 4px; background: #ff2222; border-radius: 50%; position: absolute; }

        .center-text {
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
            color: #ff4655; font-size: 24px; letter-spacing: 2px; font-weight: bold;
            opacity: 0; transition: opacity 0.2s; text-shadow: 0 0 10px rgba(255, 70, 85, 0.5);
        }

        /* Papan Skor Atas */
        #top-hud {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; justify-content: center;
            background: rgba(15, 25, 35, 0.95); padding: 5px 30px;
            border-bottom: 2px solid #ece8e1; clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
        }
        .score-box { font-size: 32px; font-weight: bold; padding: 0 20px; }
        #my-score { color: #00ffcc; }
        #enemy-score { color: #ff4655; }
        #timer { font-size: 24px; color: #fff; padding: 0 15px; border-left: 2px solid rgba(255,255,255,0.2); border-right: 2px solid rgba(255,255,255,0.2); }

        /* HUD Kiri (Nyawa & Regen) */
        #hud-bl { position: absolute; bottom: 40px; left: 40px; display: flex; align-items: flex-end; gap: 15px; }
        #hp-number { font-size: 70px; font-weight: bold; color: #00ffcc; line-height: 0.8; transition: color 0.3s;}
        .bar-container { width: 250px; display: flex; flex-direction: column; gap: 5px; margin-bottom: 5px;}
        .hp-bar-bg { width: 100%; height: 12px; background: rgba(0,0,0,0.6); transform: skewX(-20deg); border: 1px solid rgba(255,255,255,0.3); }
        #hp-bar { width: 100%; height: 100%; background: #00ffcc; transition: width 0.3s, background 0.3s; }
        #regen-icon { font-size: 16px; color: #00ffcc; margin-bottom: 10px; animation: pulse 1s infinite; display: none;}
        
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; text-shadow: 0 0 10px #00ffcc;} 100% { opacity: 0.5; } }

        /* HUD Kanan (Senjata & Slide Cooldown) */
        #hud-br { position: absolute; bottom: 40px; right: 40px; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        #ammo-wrap { display: flex; align-items: baseline; gap: 10px; color: #fff; }
        #ammo-current { font-size: 70px; font-weight: bold; color: #00ffcc; line-height: 0.8; }
        #ammo-max { font-size: 30px; color: #8b978f; }
        #weapon-name { font-size: 24px; color: #ece8e1; margin-top: -5px; letter-spacing: 2px; }
        .weapon-hints { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 5px; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 4px;}
        
        #slide-indicator { margin-top: 10px; font-size: 18px; color: #00ffcc; font-weight: bold; padding: 2px 10px; border: 2px solid #00ffcc; transform: skewX(-15deg); transition: 0.3s;}

        /* Efek Damage & Kill */
        #damage-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-shadow: inset 0 0 0px rgba(255, 70, 85, 0); transition: box-shadow 0.2s; pointer-events: none; }
        #kill-banner { position: absolute; top: 75%; left: 50%; transform: translate(-50%, -50%) scale(0.5); opacity: 0; text-align: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #kill-banner.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .kill-icon { width: 60px; height: 60px; border: 4px solid #ff4655; transform: rotate(45deg); margin: 0 auto 10px auto; position: relative; box-shadow: 0 0 20px rgba(255, 70, 85, 0.8); background: rgba(255,70,85,0.2);}
        #kill-text { font-size: 36px; color: #ff4655; font-weight: bold; letter-spacing: 5px; }
        #fade-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f1923; opacity: 1; transition: opacity 0.5s; pointer-events: none; z-index: 50; }

        /* Menu Utama HD */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2000&auto=format&fit=crop') center/cover;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ece8e1; z-index: 100;
        }
        #menu-screen::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15,25,35,0.8) 0%, rgba(15,25,35,0.95) 100%);
        }
        .menu-content { z-index: 2; text-align: center; max-width: 800px; padding: 40px; }
        
        h1 { font-size: 100px; margin: 0; color: #ff4655; text-transform: uppercase; letter-spacing: 5px; line-height: 1; text-shadow: 0 5px 15px rgba(0,0,0,0.5);}
        h2 { font-size: 20px; font-weight: normal; margin-bottom: 30px; color: #00ffcc; letter-spacing: 8px;}
        
        /* Mode Selector */
        .mode-selector { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px;}
        .mode-btn {
            background: rgba(0,0,0,0.6); border: 2px solid #ece8e1; color: #ece8e1; padding: 10px 20px;
            font-family: 'Oswald'; font-size: 20px; cursor: pointer; transition: 0.2s; text-transform: uppercase;
        }
        .mode-btn.active { background: #00ffcc; color: #0f1923; border-color: #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.5);}
        .mode-btn:hover:not(.active) { background: rgba(255,255,255,0.1); }

        .controls { background: rgba(15,25,35,0.8); padding: 25px 40px; border-left: 4px solid #ff4655; margin-bottom: 40px; text-align: left; display: inline-block; box-shadow: 10px 10px 0px rgba(0,0,0,0.5);}
        .controls p { margin: 5px 0; font-size: 16px;}
        .controls span { color: #ff4655; font-weight: bold; display: inline-block; width: 180px; }
        
        #start-btn {
            padding: 15px 80px; font-size: 32px; background: #ff4655; font-family: 'Oswald', sans-serif;
            color: #fff; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: all 0.2s;
            transform: skewX(-10deg); box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
        }
        #start-btn:hover { background: #ece8e1; color: #ff4655; transform: skewX(-10deg) translateY(-2px); box-shadow: 7px 7px 0px rgba(0,0,0,0.7);}
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="ui-layer">
        <div id="damage-overlay"></div>
        <div id="crosshair">
            <div class="ch-line" id="ch-top"></div><div class="ch-line" id="ch-bot"></div>
            <div class="ch-line" id="ch-left"></div><div class="ch-line" id="ch-right"></div>
        </div>
        
        <div id="scope-overlay">
            <div class="scope-lines scope-h"></div>
            <div class="scope-lines scope-v"></div>
            <div class="scope-dot"></div>
        </div>

        <div id="reload-text" class="center-text">RELOADING...</div>
        
        <div id="top-hud">
            <div class="score-box" id="my-score">0</div>
            <div id="timer">PISTOL DUEL</div>
            <div class="score-box" id="enemy-score">0</div>
        </div>

        <div id="kill-banner">
            <div class="kill-icon"></div>
            <div id="kill-text">HEADSHOT</div>
        </div>

        <div id="hud-bl">
            <div id="hp-number">100</div>
            <div id="regen-icon">+10 HP/s</div>
            <div class="bar-container"><div class="hp-bar-bg"><div id="hp-bar"></div></div></div>
        </div>

        <div id="hud-br">
            <div id="ammo-wrap">
                <div id="ammo-current">15</div>
                <div id="ammo-max">/ 15</div>
            </div>
            <div id="weapon-name">GHOST (CAMO)</div>
            <div class="weapon-hints">PISTOL ONLY ROUND</div>
            <div id="slide-indicator">SLIDE READY</div>
        </div>
    </div>

    <div id="fade-screen"></div>

    <div id="menu-screen">
        <div class="menu-content">
            <h1>VALOLITE</h1>
            <h2>MOVEMENT & PISTOL PATCH</h2>
            
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="NORMAL">Normal Duel</button>
                <button class="mode-btn" data-mode="NIGHT">Night / Thermal</button>
                <button class="mode-btn" data-mode="PRACTICE">Practice Range</button>
            </div>

            <div class="controls">
                <p><span>WASD</span> Bergerak</p>
                <p><span>SHIFT</span> SLIDE / Meluncur Cepat</p>
                <p><span>KLIK KIRI</span> Menembak (1-Hit Headshot)</p>
                <p><span>KLIK KANAN</span> Membidik (Akurasi 100%)</p>
                <p><span>R</span> Reload Senjata</p>
                <p><span>SPASI</span> Melompat</p>
            </div><br>

            <button id="start-btn">DEPLOY</button>
        </div>
    </div>

    <script>
        // === VARIABEL GLOBAL ===
        const canvas = document.getElementById('game-canvas');
        const uiLayer = document.getElementById('ui-layer');
        const menuScreen = document.getElementById('menu-screen');
        const startBtn = document.getElementById('start-btn');
        const scopeOverlay = document.getElementById('scope-overlay');
        const crosshair = document.getElementById('crosshair');
        const reloadText = document.getElementById('reload-text');
        const timerUI = document.getElementById('timer');
        const hpNumber = document.getElementById('hp-number');
        const hpBar = document.getElementById('hp-bar');
        const regenIcon = document.getElementById('regen-icon');
        const slideUI = document.getElementById('slide-indicator');
        
        let scene, camera, renderer, clock;
        let isGameRunning = false;
        let currentMode = 'NORMAL'; 
        
        // --- PHYSICS & COLLISION DATA ---
        let mapBoundingBoxes = []; // AABB Anti-Tembus
        let hitscanTargets = []; 
        let targetBoards = []; 
        
        // --- PLAYER (WITH SLIDE MECHANIC) ---
        let playerVelocity = new THREE.Vector3();
        let playerDirection = new THREE.Vector3();
        let isGrounded = true;
        let isPlayerDead = false; 
        
        const SPEED = 250.0;       
        const SLIDE_SPEED = 500.0; // Kecepatan meluncur 2x lipat
        const JUMP_FORCE = 65.0;    
        const GRAVITY = 220.0;     
        const PLAYER_HEIGHT = 12.0;  
        const SLIDE_HEIGHT = 6.0; // Kamera turun saat slide
        const PLAYER_RADIUS = 2.0;  
        
        let currentCamHeight = PLAYER_HEIGHT;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let pitch = 0, yaw = 0;

        let isSliding = false;
        let slideTimer = 0;
        let slideCooldown = 0;
        let slideDir = new THREE.Vector3();

        let lastRegenTime = 0;

        // --- WEAPONS (GHOST ONLY) ---
        let activeWeaponIndex = 0; 
        let weapons = [];
        let canShoot = true;
        let isReloading = false;
        let reloadProgress = 0;
        let isAiming = false;
        let targetFov = 85;

        // --- ENEMY ---
        let enemy;
        let playerScore = 0, enemyScore = 0;
        let enemyProjectiles = []; 
        let particles = [], bulletTracers = [];

        // Lighting
        let ambientLight, sunLight, hemiLight;

        // SAFE ZONES
        const SPAWN_SAFE_Z = 500; 

        // === INISIALISASI ENGINE ===
        function init() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 2500);
            
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;

            setupLighting();
            buildMassiveMap(); 
            setupWeapons();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('mousemove', onMouseMove);
            
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentMode = e.target.getAttribute('data-mode');
                });
            });

            startBtn.addEventListener('click', () => { setTimeout(startGame, 100); });
            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement !== document.body && isGameRunning && !isPlayerDead) {
                    showMenu("PAUSED", "Click DEPLOY to resume");
                }
            });

            setTimeout(() => { document.getElementById('fade-screen').style.opacity = 0; }, 500);
        }

        function setupLighting() {
            ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
            hemiLight.position.set(0, 200, 0);
            scene.add(hemiLight);

            sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
            sunLight.position.set(200, 300, 100);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 4096; 
            sunLight.shadow.mapSize.height = 4096;
            sunLight.shadow.camera.left = -750; sunLight.shadow.camera.right = 750;
            sunLight.shadow.camera.top = 750; sunLight.shadow.camera.bottom = -750;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);
        }

        function applyModeSettings() {
            if (currentMode === 'NIGHT') {
                timerUI.innerText = "THERMAL VISION";
                scene.background = new THREE.Color(0x020a02);
                scene.fog = new THREE.FogExp2(0x020a02, 0.003);
                ambientLight.color.setHex(0x00ff00); ambientLight.intensity = 0.15;
                hemiLight.intensity = 0;
                sunLight.intensity = 0.05; 
            } else {
                timerUI.innerText = currentMode === 'PRACTICE' ? "PRACTICE RANGE" : "PISTOL DUEL";
                scene.background = new THREE.Color(0x6eb8ff);
                scene.fog = new THREE.FogExp2(0x6eb8ff, 0.001);
                ambientLight.color.setHex(0xffffff); ambientLight.intensity = 0.6;
                hemiLight.intensity = 0.4;
                sunLight.intensity = 1.2;
            }

            if(enemy && enemy.group) { scene.remove(enemy.group); }
            targetBoards.forEach(tb => scene.remove(tb.mesh));
            targetBoards = [];
            
            hitscanTargets = hitscanTargets.filter(t => !t.userData.isEnemy && !t.userData.isTarget);

            if (currentMode === 'PRACTICE') spawnTargets();
            else spawnAnatomicalEnemy();
        }

        // === MASSIVE FLAT MAP (Labirin Ratusan Box + Safe Spawn) ===
        function buildMassiveMap() {
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x88929e, roughness: 0.9, metalness: 0.1 });
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xece8e1, roughness: 0.9 });
            const darkWallMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, roughness: 1.0 }); 
            const crateMat = new THREE.MeshStandardMaterial({ color: 0x4aa68a, roughness: 0.8 }); 

            // Lantai Raksasa (1500 x 1500)
            const floorGeo = new THREE.BoxGeometry(1500, 2, 1500);
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -1; floor.receiveShadow = true;
            scene.add(floor); hitscanTargets.push(floor);

            function addBox(x, y, z, w, h, d, mat) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                mesh.position.set(x, y + h/2, z);
                mesh.castShadow = true; mesh.receiveShadow = true;
                scene.add(mesh); hitscanTargets.push(mesh);
                
                mesh.updateMatrixWorld();
                const box = new THREE.Box3().setFromObject(mesh);
                mapBoundingBoxes.push(box);
            }

            // Outer Walls Raksasa
            addBox(0, 0, -750, 1500, 100, 20, wallMat);
            addBox(0, 0, 750, 1500, 100, 20, wallMat);
            addBox(-750, 0, 0, 20, 100, 1500, wallMat);
            addBox(750, 0, 0, 20, 100, 1500, wallMat);

            // Generator Labirin Padat (Random 200+ Boxes)
            for(let i = 0; i < 250; i++) {
                let w = 20 + Math.random() * 40;
                let d = 20 + Math.random() * 40;
                let h = 15 + Math.random() * 15;
                
                let cx = (Math.random() - 0.5) * 1300;
                let cz = (Math.random() - 0.5) * 1300;

                // PROTEKSI SPAWN (SAFE ZONE): Jangan taruh box di area spawn pemain dan musuh
                if (cz > SPAWN_SAFE_Z || cz < -SPAWN_SAFE_Z) continue; 
                // Biarkan lorong tengah sedikit terbuka
                if (Math.abs(cx) < 50 && Math.abs(cz) < 200) continue;

                let useMat = Math.random() > 0.8 ? wallMat : (Math.random() > 0.5 ? darkWallMat : crateMat);
                addBox(cx, 0, cz, w, h, d, useMat);

                // Tumpuk box
                if (Math.random() > 0.7) {
                    addBox(cx, h, cz, w*0.8, 15, d*0.8, crateMat);
                }
            }
        }

        // === WEAPON MODELS (GHOST PISTOL ONLY) ===
        function setupWeapons() {
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.5, metalness: 0.4 });
            const greyMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6 });
            
            // GHOST PISTOL (Green Camo + Gold accents)
            const ghostGroup = new THREE.Group();
            const gBodyMat = new THREE.MeshStandardMaterial({ color: 0x2a3324, roughness: 0.8 }); 
            const gGoldMat = new THREE.MeshStandardMaterial({ color: 0xcc9900, roughness: 0.3, metalness: 0.8 }); 
            const gGlowMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.5 });
            
            const gBody = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.15, 0.4), gBodyMat); ghostGroup.add(gBody);
            // Silencer
            const gSilencer = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.5, 16), darkMat); gSilencer.rotation.x = Math.PI/2; gSilencer.position.set(0, 0.03, -0.45); ghostGroup.add(gSilencer);
            // Acorn/Laser
            const gUnder = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.1), gGoldMat); gUnder.position.set(0, -0.05, -0.15); ghostGroup.add(gUnder);
            const gGrip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.25, 0.12), gBodyMat); gGrip.rotation.x = -0.2; gGrip.position.set(0, -0.15, 0.15); ghostGroup.add(gGrip);
            const gMag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.25, 0.1), darkMat); gMag.rotation.x = -0.2; gMag.position.set(0, -0.16, 0.15); ghostGroup.add(gMag);
            const gSight = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.02, 0.03), gGlowMat); gSight.position.set(0, 0.08, -0.1); ghostGroup.add(gSight);

            // Muzzle Flash
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xffffaa, transparent: true, opacity: 0.9, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
            const gFlash = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), flashMat); gFlash.position.set(0, 0.03, -0.8); gFlash.visible = false; ghostGroup.add(gFlash);

            // HANYA GHOST
            weapons = [
                { id: 'ghost', name: 'GHOST PISTOL', group: ghostGroup, mag: gMag, flash: gFlash, pos: [0.3, -0.3, -0.6], maxAmmo: 15, currentAmmo: 15, fireRate: 180, damage: 35, recoil: 0.02, spread: 0.005 }
            ];

            weapons[0].group.position.set(weapons[0].pos[0], weapons[0].pos[1], weapons[0].pos[2]);
            camera.add(weapons[0].group);
            scene.add(camera);
            updateWeaponUI();
        }

        function updateWeaponUI() {
            const w = weapons[0];
            document.getElementById('weapon-name').innerText = w.name;
            document.getElementById('ammo-current').innerText = w.currentAmmo;
            document.getElementById('ammo-max').innerText = '/ ' + w.maxAmmo;
        }

        // === PERFECT ANATOMICAL ENEMY ===
        function spawnAnatomicalEnemy() {
            const group = new THREE.Group();
            let isNight = currentMode === 'NIGHT';
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: isNight ? 0x000000 : 0xff4655, emissive: isNight ? 0x00ff00 : 0x000000, emissiveIntensity: isNight ? 1.0 : 0, roughness: 0.6 });
            const headMat = new THREE.MeshStandardMaterial({ color: isNight ? 0x000000 : 0xffaaaa, emissive: isNight ? 0x00ff00 : 0x000000, emissiveIntensity: isNight ? 1.0 : 0 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 2), bodyMat); torso.position.y = 7; torso.castShadow = true; group.add(torso);
            const head = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 2.5), headMat); head.position.y = 10.5; head.castShadow = true; group.add(head);

            const lLegGrp = new THREE.Group(); lLegGrp.position.set(-1, 5, 0); group.add(lLegGrp);
            const rLegGrp = new THREE.Group(); rLegGrp.position.set(1, 5, 0); group.add(rLegGrp);
            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(1.2, 5, 1.2), bodyMat); lLeg.position.y = -2.5; lLegGrp.add(lLeg);
            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(1.2, 5, 1.2), bodyMat); rLeg.position.y = -2.5; rLegGrp.add(rLeg);

            const lArmGrp = new THREE.Group(); lArmGrp.position.set(-2.5, 8.5, 0); group.add(lArmGrp);
            const rArmGrp = new THREE.Group(); rArmGrp.position.set(2.5, 8.5, 0); group.add(rArmGrp);
            const lArm = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 1), bodyMat); lArm.position.y = -2; lArmGrp.add(lArm);
            const rArm = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 1), bodyMat); rArm.position.y = -2; rArmGrp.add(rArm);

            // Musuh selalu spawn di Safe Zone musuh (Z negatif jauh)
            group.position.set((Math.random()-0.5)*200, 0, -650);

            enemy = { 
                group: group, torso: torso, head: head,
                lLeg: lLegGrp, rLeg: rLegGrp, lArm: lArmGrp, rArm: rArmGrp,
                hp: 100, isDead: false, ammo: 15, isReloading: false, reloadTimer: 0,
                shootTimer: 0, stateTimer: 0, velocity: new THREE.Vector3(), targetDir: new THREE.Vector3(1,0,0) 
            };

            group.traverse(child => {
                if(child.isMesh) {
                    child.userData.isEnemy = true;
                    if(child === head) child.userData.isHeadshot = true;
                    child.userData.enemyRef = enemy;
                    hitscanTargets.push(child);
                }
            });
            scene.add(group);
        }

        // === PRACTICE MODE TARGETS ===
        function spawnTargets() {
            const tMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.4 });
            const tGeo = new THREE.CylinderGeometry(3, 3, 0.5, 16); tGeo.rotateX(Math.PI/2);
            
            for(let i=0; i<10; i++) {
                const target = new THREE.Mesh(tGeo, tMat);
                target.position.set((Math.random()-0.5)*800, 20 + Math.random()*20, (Math.random()-0.5)*800);
                target.userData.isTarget = true;
                target.userData.baseY = target.position.y;
                target.userData.timeOff = Math.random() * Math.PI * 2;
                scene.add(target);
                hitscanTargets.push(target);
                targetBoards.push({mesh: target, active: true, respawnTimer: 0});
            }
        }

        // === INPUT CONTROLS ===
        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': 
                    if (isGrounded && !isSliding) { playerVelocity.y = JUMP_FORCE; isGrounded = false; } break;
                case 'ShiftLeft':
                    // SLIDE MECHANIC
                    if (isGrounded && !isSliding && slideCooldown <= 0 && (moveForward || moveBackward || moveLeft || moveRight)) {
                        isSliding = true;
                        slideTimer = 0.6; // Durasi meluncur
                        slideCooldown = 2.0; // Cooldown
                        slideUI.style.color = '#ff4655'; slideUI.style.borderColor = '#ff4655'; slideUI.innerText = 'SLIDE COOLDOWN';
                        
                        // Kunci arah gerakan ke arah saat ini
                        slideDir.set(0, 0, 0);
                        if (moveForward) slideDir.z -= 1;
                        if (moveBackward) slideDir.z += 1;
                        if (moveLeft) slideDir.x -= 1;
                        if (moveRight) slideDir.x += 1;
                        slideDir.normalize().applyEuler(new THREE.Euler(0, yaw, 0, 'YXZ'));
                    }
                    break;
                case 'KeyR': reloadWeapon(); break;
            }
        }
        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }
        function onMouseMove(event) {
            if (document.pointerLockElement === document.body && isGameRunning && !isPlayerDead) {
                const sensitivity = isAiming ? 0.0005 : 0.0015;
                yaw -= event.movementX * sensitivity;
                pitch -= event.movementY * sensitivity;
                pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, pitch));
                camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                
                if(!isAiming) {
                    const spread = (Math.abs(playerVelocity.x) + Math.abs(playerVelocity.z)) > 20 ? 10 : 0;
                    document.getElementById('ch-top').style.top = (-12 - spread) + 'px';
                    document.getElementById('ch-bot').style.bottom = (-12 - spread) + 'px';
                    document.getElementById('ch-left').style.left = (-12 - spread) + 'px';
                    document.getElementById('ch-right').style.right = (-12 - spread) + 'px';
                }
            }
        }
        function onMouseDown(event) {
            if (!isGameRunning || document.pointerLockElement !== document.body || isPlayerDead) return;
            const w = weapons[0];
            
            if (event.button === 0 && canShoot && !isReloading) {
                if (w.currentAmmo > 0) playerShoot();
                else reloadWeapon(); 
            } 
            else if (event.button === 2 && !isReloading) {
                isAiming = true; targetFov = 40; scopeOverlay.style.display = 'flex';
                document.getElementById('crosshair').style.opacity = 0; w.group.visible = false;
            }
        }
        function onMouseUp(event) {
            if (event.button === 2) {
                isAiming = false; targetFov = 85; scopeOverlay.style.display = 'none';
                document.getElementById('crosshair').style.opacity = 1; weapons[0].group.visible = true;
            }
        }
        document.addEventListener('contextmenu', event => event.preventDefault());

        // === HIT REGISTRATION & HEADSHOT ===
        function playerShoot() {
            const w = weapons[0];
            w.currentAmmo--; document.getElementById('ammo-current').innerText = w.currentAmmo;
            canShoot = false;
            
            w.flash.visible = true; w.flash.rotation.z = Math.random() * Math.PI;
            
            // Scope recoil sangat kecil agar akurat 100%
            let actualRecoil = isAiming ? w.recoil * 0.1 : w.recoil;
            pitch += actualRecoil; 
            
            let moveSpread = (Math.abs(playerVelocity.x) + Math.abs(playerVelocity.z)) > 20 && !isAiming ? w.spread * 5 : 0;
            let finalYaw = yaw + (Math.random()-0.5)*moveSpread;
            let finalPitch = pitch + (Math.random()-0.5)*moveSpread;
            
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            if(!isAiming) w.group.position.z += 0.2; 

            setTimeout(() => { w.flash.visible = false; }, 30);
            setTimeout(() => { canShoot = true; }, w.fireRate); 
            setTimeout(() => { if(!isAiming) w.group.position.z -= 0.2; }, 80);

            const shootDir = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(finalPitch, finalYaw, 0, 'YXZ'));
            createTracer(camera.position, shootDir, 0xffff00);

            const raycaster = new THREE.Raycaster(camera.position, shootDir);
            const intersects = raycaster.intersectObjects(hitscanTargets, true); 

            if (intersects.length > 0) {
                const hit = intersects[0];
                
                if(hit.object.userData.isEnemy && hit.object.userData.enemyRef) {
                    let targetEnemy = hit.object.userData.enemyRef;
                    if (targetEnemy.isDead) return;
                    
                    let dmg = hit.object.userData.isHeadshot ? 150 : w.damage; 
                    targetEnemy.hp -= dmg;
                    
                    createParticles(hit.point, currentMode === 'NIGHT' ? 0x00ff00 : 0xff0000);
                    
                    if(hit.object.userData.isHeadshot) {
                        document.getElementById('crosshair').style.background = 'red';
                        setTimeout(() => document.getElementById('crosshair').style.background = '#00ffcc', 150);
                    }

                    if (targetEnemy.hp <= 0) handleEnemyDeath(targetEnemy);
                } else if(hit.object.userData.isTarget) {
                    createParticles(hit.point, 0xffffff);
                    let tb = targetBoards.find(t => t.mesh === hit.object);
                    if(tb && tb.active) {
                        tb.active = false; tb.mesh.visible = false; tb.respawnTimer = 2.0;
                        playerScore++; document.getElementById('my-score').innerText = playerScore;
                    }
                } else {
                    createParticles(hit.point, 0xaaaaaa);
                }
            }
        }

        function reloadWeapon() {
            const w = weapons[0];
            if(isReloading || w.currentAmmo === w.maxAmmo) return;
            isReloading = true; reloadProgress = 0; reloadText.style.opacity = 1;
            if(isAiming) { isAiming = false; targetFov = 85; scopeOverlay.style.display = 'none'; document.getElementById('crosshair').style.opacity = 1; w.group.visible = true; }
        }

        // === FULL AABB COLLISION SWEEPING ===
        function checkAABBCollision(playerBox) {
            for (let i = 0; i < mapBoundingBoxes.length; i++) {
                if (playerBox.intersectsBox(mapBoundingBoxes[i])) return true;
            }
            return false;
        }

        function updatePhysics(delta) {
            if(isPlayerDead) return;

            // Slide Logic & Camera Height
            if (slideCooldown > 0 && !isSliding) {
                slideCooldown -= delta;
                if(slideCooldown <= 0) {
                    slideUI.style.color = '#00ffcc'; slideUI.style.borderColor = '#00ffcc'; slideUI.innerText = 'SLIDE READY';
                }
            }

            if (isSliding) {
                slideTimer -= delta;
                if (slideTimer <= 0) isSliding = false;
                currentCamHeight += (SLIDE_HEIGHT - currentCamHeight) * 15 * delta; // Jongkok cepat
            } else {
                currentCamHeight += (PLAYER_HEIGHT - currentCamHeight) * 10 * delta; // Berdiri
            }

            playerVelocity.y -= GRAVITY * delta;
            
            let groundHeight = 0;
            if (camera.position.y + playerVelocity.y * delta < groundHeight + currentCamHeight) {
                playerVelocity.y = 0; camera.position.y = groundHeight + currentCamHeight; isGrounded = true;
            } else {
                let pBoxDown = new THREE.Box3(
                    new THREE.Vector3(camera.position.x - 1, camera.position.y - currentCamHeight + playerVelocity.y * delta, camera.position.z - 1),
                    new THREE.Vector3(camera.position.x + 1, camera.position.y, camera.position.z + 1)
                );
                let hitPlatform = false;
                for(let box of mapBoundingBoxes) {
                    if(pBoxDown.intersectsBox(box)) {
                        playerVelocity.y = 0; camera.position.y = box.max.y + currentCamHeight; isGrounded = true; hitPlatform = true; break;
                    }
                }
                if(!hitPlatform) isGrounded = false;
            }

            let currentSpeed = SPEED;

            if (isSliding) {
                // Saat meluncur, kecepatan ditingkatkan dan arah dikunci
                currentSpeed = SLIDE_SPEED;
                playerVelocity.x = slideDir.x * currentSpeed;
                playerVelocity.z = slideDir.z * currentSpeed;
            } else {
                playerDirection.set(0, 0, 0);
                if (moveForward) playerDirection.z -= 1;
                if (moveBackward) playerDirection.z += 1;
                if (moveLeft) playerDirection.x -= 1;
                if (moveRight) playerDirection.x += 1;
                playerDirection.normalize().applyEuler(new THREE.Euler(0, yaw, 0, 'YXZ'));

                const friction = isGrounded ? 10.0 : 2.0; 
                playerVelocity.x -= playerVelocity.x * friction * delta;
                playerVelocity.z -= playerVelocity.z * friction * delta;

                playerVelocity.x += playerDirection.x * currentSpeed * delta;
                playerVelocity.z += playerDirection.z * currentSpeed * delta;
            }

            let pX = camera.position.x; let pZ = camera.position.z;

            // X Sweeping
            camera.position.x += playerVelocity.x * delta;
            let pBoxX = new THREE.Box3(
                new THREE.Vector3(camera.position.x - PLAYER_RADIUS, camera.position.y - currentCamHeight + 2, camera.position.z - PLAYER_RADIUS),
                new THREE.Vector3(camera.position.x + PLAYER_RADIUS, camera.position.y, camera.position.z + PLAYER_RADIUS)
            );
            if (checkAABBCollision(pBoxX)) { camera.position.x = pX; playerVelocity.x = 0; }

            // Z Sweeping
            camera.position.z += playerVelocity.z * delta;
            let pBoxZ = new THREE.Box3(
                new THREE.Vector3(camera.position.x - PLAYER_RADIUS, camera.position.y - currentCamHeight + 2, camera.position.z - PLAYER_RADIUS),
                new THREE.Vector3(camera.position.x + PLAYER_RADIUS, camera.position.y, camera.position.z + PLAYER_RADIUS)
            );
            if (checkAABBCollision(pBoxZ)) { camera.position.z = pZ; playerVelocity.z = 0; }

            camera.position.y += playerVelocity.y * delta;
            camera.fov += (targetFov - camera.fov) * 15 * delta;
            camera.updateProjectionMatrix();

            // Animasi Senjata
            const w = weapons[0];
            if (isReloading) {
                reloadProgress += delta;
                w.group.rotation.x = Math.sin(reloadProgress * Math.PI) * 0.8; 
                w.mag.position.y = (reloadProgress > 0.3 && reloadProgress < 0.7) ? -0.5 : -0.15;
                if (reloadProgress >= 1.5) { 
                    isReloading = false; reloadProgress = 0; w.group.rotation.x = 0; w.mag.position.y = -0.15;
                    w.currentAmmo = w.maxAmmo; document.getElementById('ammo-current').innerText = w.currentAmmo;
                    reloadText.style.opacity = 0;
                }
            } else {
                w.group.position.y += (w.pos[1] - w.group.position.y) * 10 * delta; 
                if (isGrounded && (Math.abs(playerVelocity.x) > 10 || Math.abs(playerVelocity.z) > 10)) {
                    const time = performance.now() * 0.015;
                    w.group.position.y = w.pos[1] - 0.05 + Math.sin(time) * 0.02;
                    w.group.position.x = w.pos[0] + Math.cos(time/2) * 0.01;
                } else {
                    w.group.position.x += (w.pos[0] - w.group.position.x) * 0.1;
                }
            }

            // === HEALTH REGENERATION LOGIC (10 HP/s) ===
            if(clock.getElapsedTime() - lastRegenTime > 1.0) {
                lastRegenTime = clock.getElapsedTime();
                let currentHP = parseInt(document.getElementById('hp-number').innerText);
                if(currentHP < 100) {
                    currentHP = Math.min(100, currentHP + 10);
                    document.getElementById('hp-number').innerText = currentHP;
                    document.getElementById('hp-bar').style.width = currentHP + '%';
                    
                    regenIcon.style.display = 'block';
                    setTimeout(() => { regenIcon.style.display = 'none'; }, 500);

                    if(currentHP > 40) {
                        document.getElementById('hp-number').style.color = '#00ffcc';
                        document.getElementById('hp-bar').style.background = '#00ffcc';
                    }
                }
            }
        }

        // === AI MUSUH CERDAS (NERF AUTO AIM & SUPER FAST BULLETS) ===
        function checkLineOfSight(start, target) {
            const dir = new THREE.Vector3().subVectors(target, start).normalize();
            const dist = start.distanceTo(target);
            const ray = new THREE.Raycaster(start, dir, 0, dist);
            for(let box of mapBoundingBoxes) {
                if(ray.ray.intersectsBox(box)) {
                    const point = new THREE.Vector3(); ray.ray.intersectBox(box, point);
                    if(start.distanceTo(point) < dist) return false;
                }
            }
            return true;
        }

        function updateAI(delta) {
            if(currentMode === 'PRACTICE') {
                targetBoards.forEach(tb => {
                    if(!tb.active) {
                        tb.respawnTimer -= delta;
                        if(tb.respawnTimer <= 0) { tb.active = true; tb.mesh.visible = true; tb.mesh.position.set((Math.random()-0.5)*800, 20 + Math.random()*30, (Math.random()-0.5)*800); }
                    } else {
                        tb.mesh.position.y = tb.mesh.userData.baseY + Math.sin(clock.getElapsedTime() * 2 + tb.mesh.userData.timeOff) * 2;
                    }
                });
                return;
            }

            if(!enemy || enemy.isDead || isPlayerDead) return;

            const distToPlayer = enemy.group.position.distanceTo(camera.position);
            const eyePos = enemy.group.position.clone(); eyePos.y += PLAYER_HEIGHT * 0.8;
            const targetPos = camera.position.clone(); targetPos.y -= 2;

            const hasLoS = checkLineOfSight(eyePos, targetPos);

            if (hasLoS) {
                const angle = Math.atan2(camera.position.x - enemy.group.position.x, camera.position.z - enemy.group.position.z);
                enemy.group.rotation.y += (angle - enemy.group.rotation.y) * 10 * delta;
            } else {
                enemy.group.rotation.y = Math.atan2(enemy.targetDir.x, enemy.targetDir.z);
            }

            if (enemy.isReloading) {
                enemy.reloadTimer -= delta;
                if(enemy.reloadTimer <= 0) { enemy.isReloading = false; enemy.ammo = 15; }
            }

            enemy.shootTimer += delta;
            const AI_SPEED = 60; 
            
            if (hasLoS && !enemy.isReloading) {
                enemy.targetDir.set(0,0,0);
                if(distToPlayer < 80) { 
                    const angle = enemy.group.rotation.y;
                    enemy.targetDir.set(-Math.sin(angle), 0, -Math.cos(angle));
                } else if(distToPlayer > 150) { 
                    const angle = enemy.group.rotation.y;
                    enemy.targetDir.set(Math.sin(angle), 0, Math.cos(angle));
                }
                
                if (enemy.shootTimer > 0.5 && enemy.ammo > 0) {
                    enemyShootProjectile(eyePos, targetPos, distToPlayer);
                    enemy.shootTimer = 0; enemy.ammo--;
                    if(enemy.ammo <= 0) { enemy.isReloading = true; enemy.reloadTimer = 3.0; }
                }
            } else {
                if(enemy.targetDir.lengthSq() === 0) {
                    const angle = Math.random() * Math.PI * 2;
                    enemy.targetDir.set(Math.sin(angle), 0, Math.cos(angle));
                }
                
                let eBox = new THREE.Box3(
                    new THREE.Vector3(enemy.group.position.x - 2 + enemy.targetDir.x, 0, enemy.group.position.z - 2 + enemy.targetDir.z),
                    new THREE.Vector3(enemy.group.position.x + 2 + enemy.targetDir.x, 10, enemy.group.position.z + 2 + enemy.targetDir.z)
                );
                if(checkAABBCollision(eBox)) {
                    enemy.targetDir.applyEuler(new THREE.Euler(0, Math.PI/2, 0)); 
                }
            }

            enemy.group.position.addScaledVector(enemy.targetDir, AI_SPEED * delta);
            
            if(enemy.targetDir.lengthSq() > 0.1) {
                const time = clock.getElapsedTime() * 15;
                enemy.lLeg.rotation.x = Math.sin(time) * 0.6; enemy.rLeg.rotation.x = -Math.sin(time) * 0.6;
                enemy.lArm.rotation.x = -Math.sin(time) * 0.6; enemy.rArm.rotation.x = Math.sin(time) * 0.6;
            } else {
                enemy.lLeg.rotation.x = 0; enemy.rLeg.rotation.x = 0; enemy.lArm.rotation.x = 0; enemy.rArm.rotation.x = 0;
            }
        }

        function enemyShootProjectile(startPos, targetPos, dist) {
            const finalTarget = targetPos.clone();
            
            // NERF AUTO AIM: Tambahkan spread (meleset) yang makin besar kalau jaraknya jauh
            let missAmount = Math.min(dist * 0.15, 30); // Maksimal miss 30 unit
            finalTarget.x += (Math.random()-0.5) * missAmount; 
            finalTarget.y += (Math.random()-0.5) * missAmount * 0.5;

            const dir = new THREE.Vector3().subVectors(finalTarget, startPos).normalize();
            
            const projGeo = new THREE.CylinderGeometry(0.2, 0.2, 4, 8); projGeo.rotateX(Math.PI/2);
            const projMat = new THREE.MeshBasicMaterial({ color: currentMode === 'NIGHT' ? 0x00ff00 : 0xff4655 });
            const proj = new THREE.Mesh(projGeo, projMat);

            proj.position.copy(startPos);
            proj.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), dir);
            
            // SUPER FAST BULLETS (Hitscan-like feel)
            proj.userData.velocity = dir.multiplyScalar(3000); 
            proj.userData.lifespan = 2.0;

            scene.add(proj);
            enemyProjectiles.push(proj);
        }

        // --- SISTEM PEMBANTU ---
        function createTracer(startPos, direction, colorHex) {
            const material = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.8 });
            const points = [startPos.clone().addScaledVector(direction, 2), startPos.clone().addScaledVector(direction, 2000)];
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material);
            scene.add(line); bulletTracers.push({ mesh: line, life: 0.05 });
        }
        function createParticles(position, color) {
            for(let i=0; i<8; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshBasicMaterial({ color: color }));
                p.position.copy(position);
                p.userData.velocity = new THREE.Vector3((Math.random()-0.5)*30, Math.random()*30, (Math.random()-0.5)*30);
                p.userData.lifespan = 0.4; scene.add(p); particles.push(p);
            }
        }

        function handleEnemyDeath(deadEnemy) {
            if(deadEnemy.isDead) return;
            deadEnemy.isDead = true; 
            
            deadEnemy.group.rotation.x = -Math.PI/2; 
            
            playerScore++; document.getElementById('my-score').innerText = playerScore;
            
            const kb = document.getElementById('kill-banner'); kb.classList.add('active');
            setTimeout(() => kb.classList.remove('active'), 1500);
            
            setTimeout(() => { 
                if(!isGameRunning) return;
                deadEnemy.group.rotation.x = 0; deadEnemy.hp = 100; deadEnemy.isDead = false; deadEnemy.ammo = 15;
                // Respawn di Safe Zone
                deadEnemy.group.position.set((Math.random()-0.5)*200, 0, -SPAWN_SAFE_Z);
            }, 3000);
        }
        
        function updateProjectiles(delta) {
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                let p = enemyProjectiles[i];
                const oldPos = p.position.clone();
                p.position.addScaledVector(p.userData.velocity, delta);
                p.userData.lifespan -= delta;

                // Karena peluru sangat cepat, kita gunakan Raycaster untuk cek hitbox pemain
                const ray = new THREE.Raycaster(oldPos, p.userData.velocity.clone().normalize(), 0, oldPos.distanceTo(p.position));
                
                let playerHit = false;
                if (!isPlayerDead) {
                    const pointOnLine = new THREE.Vector3();
                    ray.ray.closestPointToPoint(camera.position, pointOnLine);
                    // Hitbox player (silinder)
                    if(pointOnLine.distanceTo(camera.position) < PLAYER_RADIUS + 2) {
                        playerHit = true;
                    }
                }

                if (playerHit) {
                    takeDamage(25); 
                    scene.remove(p); enemyProjectiles.splice(i, 1);
                    continue;
                }

                let hitWall = false;
                for(let box of mapBoundingBoxes) {
                    if(ray.ray.intersectsBox(box)) { hitWall = true; break; }
                }
                
                if(hitWall) {
                    createParticles(p.position, 0xffaa00); 
                    scene.remove(p); enemyProjectiles.splice(i, 1);
                    continue;
                }

                if (p.userData.lifespan <= 0) { scene.remove(p); enemyProjectiles.splice(i, 1); }
            }
        }

        function takeDamage(amount) {
            if(isPlayerDead) return; 

            let pHealth = parseInt(document.getElementById('hp-number').innerText) - amount;
            if(pHealth <= 0) pHealth = 0;
            document.getElementById('hp-number').innerText = pHealth;
            document.getElementById('hp-bar').style.width = pHealth + '%';
            document.getElementById('damage-overlay').style.boxShadow = "inset 0 0 150px rgba(255, 70, 85, 0.8)";
            setTimeout(() => document.getElementById('damage-overlay').style.boxShadow = "none", 150);
            
            if(pHealth <= 40) {
                document.getElementById('hp-number').style.color = '#ff4655';
                document.getElementById('hp-bar').style.background = '#ff4655';
            }

            if (pHealth <= 0) {
                isPlayerDead = true;
                enemyScore++; document.getElementById('enemy-score').innerText = enemyScore;
                document.getElementById('fade-screen').style.opacity = 1;
                
                setTimeout(() => {
                    document.getElementById('hp-number').innerText = 100; document.getElementById('hp-bar').style.width = '100%';
                    document.getElementById('hp-number').style.color = '#00ffcc'; document.getElementById('hp-bar').style.background = '#00ffcc';
                    
                    camera.position.set(0, PLAYER_HEIGHT, SPAWN_SAFE_Z); yaw = 0; pitch = 0; 
                    
                    if(enemy && enemy.group) {
                        enemy.hp = 100; enemy.isDead = false;
                        enemy.group.rotation.x = 0;
                        enemy.group.position.set((Math.random()-0.5)*200, 0, -SPAWN_SAFE_Z);
                    }
                    
                    document.getElementById('fade-screen').style.opacity = 0;
                    isPlayerDead = false;
                }, 2000);
            }
        }

        // === MAIN LOOP ===
        function animate() {
            requestAnimationFrame(animate);
            if (isGameRunning) {
                const delta = Math.min(clock.getDelta(), 0.1); 
                updatePhysics(delta);
                updateAI(delta);
                updateProjectiles(delta);
                
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i]; p.position.addScaledVector(p.userData.velocity, delta); p.userData.velocity.y -= GRAVITY * delta; p.userData.lifespan -= delta;
                    p.scale.setScalar(Math.max(0, p.userData.lifespan * 2)); if (p.userData.lifespan <= 0 || p.position.y < 0) { scene.remove(p); particles.splice(i, 1); }
                }
                for (let i = bulletTracers.length - 1; i >= 0; i--) {
                    let t = bulletTracers[i]; t.life -= delta; t.mesh.material.opacity = t.life * 20;
                    if (t.life <= 0) { scene.remove(t.mesh); bulletTracers.splice(i, 1); }
                }
            } else {
                camera.rotation.y += 0.001; 
            }
            renderer.render(scene, camera);
        }

        function startGame() {
            applyModeSettings();
            document.body.requestPointerLock();
            menuScreen.style.display = 'none'; uiLayer.style.display = 'block';
            
            if(!isGameRunning) {
                playerScore = 0; enemyScore = 0;
                document.getElementById('my-score').innerText = 0; document.getElementById('enemy-score').innerText = 0;
                camera.position.set(0, PLAYER_HEIGHT, SPAWN_SAFE_Z); yaw = 0; pitch = 0;
            }
            
            isGameRunning = true; clock.getDelta(); lastRegenTime = clock.getElapsedTime();
        }

        function showMenu(t, s) {
            isGameRunning = false; 
            document.exitPointerLock(); 
            uiLayer.style.display = 'none'; 
            menuScreen.style.display = 'flex';
            document.querySelector('h1').innerText = t; 
            document.querySelector('h2').innerText = s;
        }

        init(); animate();
    </script>
</body>
</html>
